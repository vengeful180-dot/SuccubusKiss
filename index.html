<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Lilith's Kiss</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Cinzel:wght@400;600&family=Cormorant+Garamond:ital,wght@1,500;1,600&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#06010a;
    --rose:#ff3d8b;
    --rose-soft:#ff9cc4;
    --ink:#fbe0ec;
    --ink-dim:#c792b0;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg-deep);overflow:hidden;color:var(--ink);
    font-family:'Cinzel',Georgia,serif;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  #stage{position:fixed;inset:0;overflow:hidden;cursor:pointer}
  #shake{position:absolute;inset:0;will-change:transform}
  #bg{position:absolute;inset:-6%;
    background:
      radial-gradient(ellipse 38% 34% at 50% 36%, rgba(120,20,80,.55) 0%, rgba(120,20,80,0) 100%),
      radial-gradient(ellipse 70% 62% at 50% 40%, #2c0628 0%, #16031b 48%, var(--bg-deep) 82%);}
  .fog{position:absolute;border-radius:50%;pointer-events:none;opacity:.45}
  #fog1{width:70vmax;height:28vmax;left:-20vmax;bottom:-8vmax;background:radial-gradient(closest-side,rgba(160,30,110,.55),transparent);animation:drift1 26s ease-in-out infinite alternate}
  #fog2{width:60vmax;height:24vmax;right:-18vmax;bottom:-4vmax;background:radial-gradient(closest-side,rgba(110,20,140,.5),transparent);animation:drift2 32s ease-in-out infinite alternate}
  @keyframes drift1{to{transform:translate(22vmax,-3vmax) scale(1.15)}}
  @keyframes drift2{to{transform:translate(-20vmax,-2vmax) scale(1.2)}}
  svg#scene{position:absolute;inset:0;width:100%;height:100%;display:block}
  canvas#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  #vignette{position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(ellipse 90% 85% at 50% 45%, transparent 58%, rgba(3,0,6,.8) 100%)}
  #kisses{position:absolute;inset:0;pointer-events:none}
  .kiss{position:absolute;pointer-events:none;transform:translate(-50%,-50%) rotate(var(--r));will-change:transform,opacity;
    animation:stamp .55s cubic-bezier(.2,1.5,.4,1) both;transition:opacity 3s ease}
  .kiss.fade{opacity:0 !important}
  @keyframes stamp{
    0%{opacity:0;transform:translate(-50%,-50%) rotate(var(--r)) scale(1.4)}
    30%{opacity:1}
    100%{opacity:.94;transform:translate(-50%,-50%) rotate(var(--r)) scale(1)}}
  #flash{position:absolute;inset:0;pointer-events:none;opacity:0;
    background:radial-gradient(circle at var(--fx,50%) var(--fy,55%), rgba(255,235,244,.95), rgba(255,70,150,.35) 30%, transparent 65%)}
  #caption{position:absolute;left:0;right:0;bottom:max(22px,env(safe-area-inset-bottom));text-align:center;
    pointer-events:none;opacity:0;transform:translateY(12px);transition:opacity 2.2s ease,transform 2.2s ease}
  #caption.show{opacity:1;transform:none}
  #caption .name{font-family:'Great Vibes',cursive;font-size:clamp(38px,6vw,62px);line-height:1;color:#ffc6de;
    text-shadow:0 0 18px rgba(255,61,139,.75),0 0 42px rgba(255,61,139,.35)}
  #caption .tip{margin-top:8px;font-size:10.5px;letter-spacing:.34em;text-transform:uppercase;color:var(--ink-dim);opacity:.85}
  #hud{position:absolute;top:max(14px,env(safe-area-inset-top));right:14px;display:flex;gap:10px;opacity:0;transition:opacity 1.5s ease;z-index:5}
  #hud.show{opacity:1}
  #hud button{width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,140,190,.35);background:rgba(30,4,26,.45);
    color:#ffd0e4;display:grid;place-items:center;cursor:pointer;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    transition:background .3s,border-color .3s}
  #hud button:hover{background:rgba(90,10,60,.55);border-color:rgba(255,140,190,.7)}
  #hud svg{width:18px;height:18px}
  #bubble{position:absolute;left:0;top:0;z-index:4;pointer-events:none;max-width:min(62vw,300px);padding:10px 16px 11px;border-radius:18px;
    font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-weight:600;font-size:clamp(16px,2.3vw,21px);line-height:1.2;color:#ffe3ef;
    background:rgba(34,4,28,.78);border:1px solid rgba(255,120,180,.55);box-shadow:0 0 22px rgba(255,61,139,.35);
    opacity:0;transform:translate(-50%,-100%) scale(.85);transition:opacity .35s ease,transform .35s cubic-bezier(.2,1.4,.4,1);white-space:nowrap}
  #bubble.show{opacity:1;transform:translate(-50%,-100%) scale(1)}
  #bubble::after{content:'';position:absolute;left:22px;bottom:-8px;width:14px;height:14px;background:rgba(34,4,28,.78);
    border-right:1px solid rgba(255,120,180,.55);border-bottom:1px solid rgba(255,120,180,.55);transform:rotate(45deg)}
  .ear{cursor:grab}
  #intro{position:fixed;inset:0;z-index:20;display:grid;place-items:center;cursor:pointer;
    background:radial-gradient(ellipse at 50% 45%, #25061f 0%, #0a010d 62%, #040007 100%);
    transition:opacity 1.4s ease,visibility 1.4s}
  #intro.gone{opacity:0;visibility:hidden}
  .intro-inner{text-align:center;padding:24px}
  .sigil{width:min(48vw,210px);height:auto;animation:spin 30s linear infinite;filter:drop-shadow(0 0 14px rgba(255,61,139,.65))}
  @keyframes spin{to{transform:rotate(360deg)}}
  #intro h1{font-family:'Cinzel Decorative',serif;font-weight:400;letter-spacing:.3em;margin:22px 0 6px;padding-left:.3em;
    font-size:clamp(30px,7vw,58px);color:#ffd9ea;text-shadow:0 0 22px rgba(255,61,139,.6)}
  #intro .sub{font-family:'Great Vibes',cursive;font-size:clamp(22px,5vw,32px);color:var(--rose-soft);margin:0 0 30px}
  #intro .summon{font-family:'Cinzel',serif;letter-spacing:.24em;font-size:13px;color:#ffe9f3;padding:15px 30px;border-radius:999px;
    background:linear-gradient(180deg,rgba(255,61,139,.28),rgba(120,10,70,.4));border:1px solid rgba(255,130,185,.6);
    box-shadow:0 0 26px rgba(255,61,139,.35),inset 0 0 14px rgba(255,61,139,.25);display:inline-block;animation:pulse 2.6s ease-in-out infinite}
  @keyframes pulse{50%{box-shadow:0 0 44px rgba(255,61,139,.6),inset 0 0 18px rgba(255,61,139,.4)}}
  #intro .hint{margin-top:18px;font-size:10.5px;letter-spacing:.3em;color:#a77895;text-transform:uppercase}
</style>
</head>

$('#btnSound').addEventListener('click', e => { e.stopPropagation(); A.init(); const on = A.toggle(); const b = e.currentTarget; b.querySelector('.w').style.display = on ? '' : 'none'; b.querySelector('.x').style.display = on ? 'none' : ''; });
$('#btnReplay').addEventListener('click', e => { e.stopPropagation(); A.init(); $('#caption').classList.remove('show'); kissCount = 0; nextAutoKiss = 0; react = null; jumpTo(0); });
document.addEventListener('visibilitychange', () => { if (!A.C) return; if (document.hidden) A.C.suspend(); else A.C.resume(); });
addEventListener('resize', layout);

buildRoom(); buildLegs(); buildHands();
preparePrints();
layout();
// deep link for previews: #t=5.4 freezes the timeline at that moment (no audio); add &g=feet&gt=5 to freeze a gesture too
const m = location.hash.match(/t=([\d.]+)/);
const mg = location.hash.match(/g=(\w+)&gt=([\d.]+)/);
if (mg) dbgG = { n: mg[1], gt: parseFloat(mg[2]) };
if (m) { started = true; $('#intro').classList.add('gone'); const t = parseFloat(m[1]); seq = t; playing = false; if (dbgG) { startGest(dbgG.n); gest.t0 = T - dbgG.gt; } render(compute(), 0); runEvents(-1, t); if (t >= 9.6) { $('#caption').classList.add('show'); $('#hud').classList.add('show'); } }
requestAnimationFrame(frame);
})();
