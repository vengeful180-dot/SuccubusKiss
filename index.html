<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Lilith's Kiss</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Cinzel:wght@400;600&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#06010a;
    --rose:#ff3d8b;
    --rose-soft:#ff9cc4;
    --ink:#fbe0ec;
    --ink-dim:#c792b0;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg-deep);overflow:hidden;color:var(--ink);
    font-family:'Cinzel',Georgia,serif;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  #stage{position:fixed;inset:0;overflow:hidden;cursor:pointer}
  #bg{position:absolute;inset:-6%;
    background:
      radial-gradient(ellipse 38% 34% at 50% 36%, rgba(120,20,80,.55) 0%, rgba(120,20,80,0) 100%),
      radial-gradient(ellipse 70% 62% at 50% 40%, #2c0628 0%, #16031b 48%, var(--bg-deep) 82%);}
  .fog{position:absolute;border-radius:50%;pointer-events:none;opacity:.45}
  #fog1{width:70vmax;height:28vmax;left:-20vmax;bottom:-8vmax;background:radial-gradient(closest-side,rgba(160,30,110,.55),transparent);animation:drift1 26s ease-in-out infinite alternate}
  #fog2{width:60vmax;height:24vmax;right:-18vmax;bottom:-4vmax;background:radial-gradient(closest-side,rgba(110,20,140,.5),transparent);animation:drift2 32s ease-in-out infinite alternate}
  @keyframes drift1{to{transform:translate(22vmax,-3vmax) scale(1.15)}}
  @keyframes drift2{to{transform:translate(-20vmax,-2vmax) scale(1.2)}}
  svg#scene{position:absolute;inset:0;width:100%;height:100%;display:block}
  canvas#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  #vignette{position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(ellipse 90% 85% at 50% 45%, transparent 58%, rgba(3,0,6,.8) 100%)}
  #kisses{position:absolute;inset:0;pointer-events:none}
  .kiss{position:absolute;pointer-events:none;transform:translate(-50%,-50%) rotate(var(--r));
    animation:stamp .55s cubic-bezier(.2,1.5,.4,1) both;filter:drop-shadow(0 0 10px rgba(255,30,90,.35));
    transition:opacity 3s ease}
  .kiss.fade{opacity:0 !important}
  @keyframes stamp{
    0%{opacity:0;transform:translate(-50%,-50%) rotate(var(--r)) scale(1.4)}
    30%{opacity:1}
    100%{opacity:.94;transform:translate(-50%,-50%) rotate(var(--r)) scale(1)}}
  #flash{position:absolute;inset:0;pointer-events:none;opacity:0;
    background:radial-gradient(circle at var(--fx,50%) var(--fy,55%), rgba(255,235,244,.95), rgba(255,70,150,.35) 30%, transparent 65%)}
  #caption{position:absolute;left:0;right:0;bottom:max(22px,env(safe-area-inset-bottom));text-align:center;
    pointer-events:none;opacity:0;transform:translateY(12px);transition:opacity 2.2s ease,transform 2.2s ease}
  #caption.show{opacity:1;transform:none}
  #caption .name{font-family:'Great Vibes',cursive;font-size:clamp(38px,6vw,62px);line-height:1;color:#ffc6de;
    text-shadow:0 0 18px rgba(255,61,139,.75),0 0 42px rgba(255,61,139,.35)}
  #caption .tip{margin-top:8px;font-size:10.5px;letter-spacing:.34em;text-transform:uppercase;color:var(--ink-dim);opacity:.85}
  #hud{position:absolute;top:max(14px,env(safe-area-inset-top));right:14px;display:flex;gap:10px;opacity:0;transition:opacity 1.5s ease;z-index:5}
  #hud.show{opacity:1}
  #hud button{width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,140,190,.35);background:rgba(30,4,26,.45);
    color:#ffd0e4;display:grid;place-items:center;cursor:pointer;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    transition:background .3s,border-color .3s}
  #hud button:hover{background:rgba(90,10,60,.55);border-color:rgba(255,140,190,.7)}
  #hud svg{width:18px;height:18px}
  #intro{position:fixed;inset:0;z-index:20;display:grid;place-items:center;cursor:pointer;
    background:radial-gradient(ellipse at 50% 45%, #25061f 0%, #0a010d 62%, #040007 100%);
    transition:opacity 1.4s ease,visibility 1.4s}
  #intro.gone{opacity:0;visibility:hidden}
  .intro-inner{text-align:center;padding:24px}
  .sigil{width:min(48vw,210px);height:auto;animation:spin 30s linear infinite;filter:drop-shadow(0 0 14px rgba(255,61,139,.65))}
  @keyframes spin{to{transform:rotate(360deg)}}
  #intro h1{font-family:'Cinzel Decorative',serif;font-weight:400;letter-spacing:.3em;margin:22px 0 6px;padding-left:.3em;
    font-size:clamp(30px,7vw,58px);color:#ffd9ea;text-shadow:0 0 22px rgba(255,61,139,.6)}
  #intro .sub{font-family:'Great Vibes',cursive;font-size:clamp(22px,5vw,32px);color:var(--rose-soft);margin:0 0 30px}
  #intro .summon{font-family:'Cinzel',serif;letter-spacing:.24em;font-size:13px;color:#ffe9f3;padding:15px 30px;border-radius:999px;
    background:linear-gradient(180deg,rgba(255,61,139,.28),rgba(120,10,70,.4));border:1px solid rgba(255,130,185,.6);
    box-shadow:0 0 26px rgba(255,61,139,.35),inset 0 0 14px rgba(255,61,139,.25);display:inline-block;animation:pulse 2.6s ease-in-out infinite}
  @keyframes pulse{50%{box-shadow:0 0 44px rgba(255,61,139,.6),inset 0 0 18px rgba(255,61,139,.4)}}
  #intro .hint{margin-top:18px;font-size:10.5px;letter-spacing:.3em;color:#a77895;text-transform:uppercase}
</style>
</head>
<body>
<div id="stage">
  <div id="bg"></div>
  <div class="fog" id="fog1"></div>
  <div class="fog" id="fog2"></div>

  <svg id="scene" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid meet" aria-label="Lilith, a succubus, blowing a kiss">

  addKiss(cx, cy, Math.max(110, r.width * 1.45));
  flash.style.setProperty('--fx', (cx / innerWidth * 100).toFixed(1) + '%'); flash.style.setProperty('--fy', (cy / innerHeight * 100).toFixed(1) + '%');
  flash.animate([{ opacity: .85 }, { opacity: 0 }], { duration: 650, easing: 'ease-out' });
  shake = { t0: T, amp: 9 };
  fx.burst(cx, cy, 30, 1.1);
  A.impact();
}
function blowHeart(grow) { const r = mouthRect(); fx.bigHeart(r.left + r.width / 2, r.top + r.height / 2, grow); fx.sparkles(r.left + r.width / 2, r.top + r.height / 2, 8, 20); A.pop(); }
function eyeSparkle(id) { const r = $('#eye' + id).getBoundingClientRect(); fx.sparkles(r.left + r.width * .8, r.top + r.height * .2, 6, 16); }

/* ---------------- sequence events ---------------- */
const EVENTS = [
  [.02, () => { A.hbStart(58, .5); if (!A.droneOn && A.C) { A.drone(A.now); A.droneOn = true; } }],
  [.95, () => A.glint()],
  [1.2, () => { if (A.C) { A.boom(A.now); A.choir(A.now, 5.5, [50, 57, 62, 65], .05); } }],
  [1.5, () => A.flap(.85)],
  [2.0, () => A.startPad()],
  [2.25, () => A.flap(.65)],
  [3.55, () => A.chime([74, 81, 86], .05)],
  [4.3, () => { if (A.C) A.whoosh(1.05); A.hbSet(92, .6); }],
  [5.14, () => { if (A.C) A.kiss(A.now + .24); }],
  [5.38, () => { impact(); A.sparkle(1.2, 16, .03); }],
  [5.5, () => A.flap(.45)],
  [6.3, () => A.hbSet(66, .4)],
  [6.95, () => { A.chime([81, 86, 88, 93], .045); eyeSparkle('R'); }],
  [8.55, () => blowHeart(1)],
  [9.6, () => { $('#caption').classList.add('show'); $('#hud').classList.add('show'); A.hbStop(); A.mel = true; }],
];
function runEvents(t0, t1) { for (const [t, fn] of EVENTS) if (t > t0 && t <= t1 && !fired.has(t)) { fired.add(t); try { fn(); } catch (e) { console.error(e); } } }
function jumpTo(t) {
  blendFrom = lastState; blendT0 = T;
  for (const [et] of EVENTS) if (et >= t) fired.delete(et);
  seq = t; gest = null; playing = true;
}

/* ---------------- state ---------------- */
function idleGaze() {
  if (T - mouse.t < 4) {
    const r = headFront.getBoundingClientRect(), fxp = r.left + r.width / 2, fyp = r.top + r.height * .45;
    return [clamp((mouse.x - fxp) / (innerWidth * .45), -1, 1) * .9, clamp((mouse.y - fyp) / (innerHeight * .45), -1, 1) * .7];
  }
  return [.28 * Math.sin(T * .23) + .14 * Math.sin(T * .61 + 2), .14 * Math.sin(T * .31 + 1)];
}
function compute() {
  const s = {};
  for (const k in TL) s[k] = sample(TL[k], seq, k === 'zoom');
  Object.assign(s, DEF);
  const w = smooth(9.4, 11, seq);
  s.headRot += w * (Math.sin(T * .45) * 2.2 + Math.sin(T * .83 + 1) * .8);
  s.headX += w * Math.sin(T * .37) * 4; s.headY += w * Math.sin(T * .6 + .5) * 1.5;
  s.smile += w * .08 * Math.sin(T * .27);
  const ig = idleGaze(); s.gazeX = lerp(s.gazeX, ig[0], w); s.gazeY = lerp(s.gazeY, ig[1], w);
  if (gest) {
    const lt = T - gest.t0;
    if (lt > gest.g.dur) gest = null;
    else {
      for (const k in gest.g.tr) { const v = sample(gest.g.tr[k], lt); if (k in DEF) s[k] *= v; else s[k] += v; }
      for (const [ft, name] of gest.g.fx || []) if (lt >= ft && !gestFired[ft]) { gestFired[ft] = 1; gestFx(name); }
    }
  }
  // blink
  const canBlink = seq > 2.6 && !(seq > 4.4 && seq < 7.9);
  if (canBlink && T > blink.next && T - blink.t0 > .5) { blink.t0 = T; blink.dbl = Math.random() < .18; blink.next = T + rand(2.4, 5.6); }
  const bt = T - blink.t0, bOne = x => x < 0 || x > .17 ? 0 : Math.sin(x / .17 * Math.PI);
  const b = bOne(bt) + (blink.dbl ? bOne(bt - .24) : 0);
  s.eyeL *= s.eyeMul * (1 - b); s.eyeR *= s.eyeMul * s.eyeRMul * (1 - b);
  s.breath = Math.sin(T * 1.45);
  if (blendFrom) { const k = smooth(0, .7, T - blendT0); if (k >= 1) blendFrom = null; else for (const key in s) if (key in blendFrom && key !== 'breath') s[key] = lerp(blendFrom[key], s[key], k); }
  lastState = s;
  return s;
}
function gestFx(name) {
  if (name === 'wink') { A.chime([86, 93], .04); eyeSparkle('R'); }
  else if (name === 'flap') A.flap(.55);
  else if (name === 'heart') blowHeart(.55);
}
function scheduleGestures() {
  if (seq < 11 || gest) return;
  if (!nextGest) nextGest = T + rand(2.5, 4);
  if (T >= nextGest) {
    const names = Object.keys(GEST).filter(n => n !== lastGestName);
    const name = names[Math.floor(Math.random() * names.length)];
    gest = { g: GEST[name], t0: T }; gestFired = {}; lastGestName = name; nextGest = T + GEST[name].dur + rand(4.5, 8.5);
  }
}

/* ---------------- render ---------------- */
function render(s, dt) {
  // camera
  const z = s.zoom, k = clamp((z - 1) / Math.max(.01, zoomMax - 1)), Fx = 400, Fy = 418;
  const Cx = VB.x0 + VB.w / 2, Cy = VB.y0 + VB.h / 2;
  const sx = Fx + (Cx - Fx) * k, sy = Fy + (Cy + VB.h * .09 - Fy) * k;
  cam.setAttribute('transform', `translate(${F(sx)} ${F(sy)}) scale(${(Math.round(z * 1000) / 1000)}) translate(${-Fx} ${-Fy})`);
  const bz = Math.pow(z, -.55);
  bgL.setAttribute('transform', `translate(${Fx} ${Fy}) scale(${Math.round(bz * 1000) / 1000}) translate(${-Fx} ${-Fy})`);
  const st = T - shake.t0, sa = shake.amp * Math.exp(-st * 9);
  stage.style.transform = sa > .05 ? `translate(${F(Math.sin(st * 63) * sa)}px, ${F(Math.cos(st * 51) * sa)}px)` : '';

  // background
  circleG.setAttribute('opacity', F(s.circle * (.62 + .12 * Math.sin(T * 1.7)) * 100) / 100);
  $('#ringOuter').setAttribute('transform', `rotate(${F(T * 5)})`);
  $('#ringInner').setAttribute('transform', `rotate(${F(-T * 8)})`);
  halo.setAttribute('opacity', F(s.halo * (.9 + .1 * Math.sin(T * 1.1)) * 100) / 100);
  darkR.setAttribute('opacity', F(s.dark * 100) / 100);
  darkR.style.display = s.dark < .005 ? 'none' : '';
  eyeGlowG.setAttribute('opacity', F(s.eyeGlow * clamp(s.dark * 1.4) * 100) / 100);

  // wings + tail
  updWings(s.wingS * (1 + .02 * Math.sin(T * 1.2)), s.wingRot + Math.sin(T * 1.2) * 3 * smooth(3, 4, seq), s.wingSc);
  updTail(T, s.tail);

  // body / breathing
  const br = s.breath;
  breathG.setAttribute('transform', `translate(400 1000) scale(${1 + .004 * br} ${1 + .009 * br}) translate(-400 -1000)`);
  const hy = s.headY - br * 4.6, hx = s.headX;
  const ht = `translate(${F(hx)} ${F(hy)}) rotate(${F(s.headRot)} 400 470) translate(400 470) scale(${HS}) translate(-400 -470)`;
  headFront.setAttribute('transform', ht); headBack.setAttribute('transform', ht); eyeGlowG.setAttribute('transform', ht);

  // face
  EYES.forEach(e => updEye(e, clamp(e.id === 'L' ? s.eyeL : s.eyeR), s.gazeX, s.gazeY, s.pupil, e.id === 'L' ? s.browL : s.browR));
  updMouth({ smile: s.smile, smirk: s.smirk, pucker: clamp(s.pucker), open: clamp(s.open), press: clamp(s.press) });
  const bl = F(clamp(s.blush) * 100) / 100; blushL.setAttribute('opacity', bl); blushR.setAttribute('opacity', bl);

  // hair (lags behind head rotation)
  headSmooth += (s.headRot - headSmooth) * Math.min(1, dt * 3.2);
  const wind = .5 * Math.sin(T * .31) + .3 * Math.sin(T * .77 + 1);
  updHair(T, (headSmooth - s.headRot) * .12, wind);
  const sw = Math.sin(T * 2.1) * 7 - (s.headRot - headSmooth) * 1.5;
  ringL.setAttribute('transform', `rotate(${F(sw)} 300 370)`); ringR.setAttribute('transform', `rotate(${F(sw * .9 + 2)} 500 370)`);
}

/* ---------------- main loop ---------------- */
let emberAcc = 0, heartAcc = 0, glintAcc = 0;
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now; T += dt;
  if (playing) { const p = seq; seq += dt; runEvents(p, seq); }
  scheduleGestures();
  const s = compute();
  render(s, dt);
  emberAcc += dt * (started ? 7 : 3); while (emberAcc > 1) { emberAcc--; fx.ember(); }
  if (seq > 10) { heartAcc += dt * .45; while (heartAcc > 1) { heartAcc--; fx.floatHeart(); } }
  if (seq > 4) { glintAcc += dt; if (glintAcc > 3.2) { glintAcc = 0; const g = document.querySelectorAll('.gem')[Math.random() < .5 ? 0 : 1].getBoundingClientRect(); fx.sparkles(g.left + g.width / 2, g.top + g.height / 2, 2, 4); } }
  fx.step(dt);
  requestAnimationFrame(frame);
}

/* ---------------- interaction ---------------- */
function start() {
  if (started) return;
  started = true;
  A.init();
  $('#intro').classList.add('gone');
  seq = 0; playing = true;
}
$('#intro').addEventListener('click', start);
stage.addEventListener('click', () => {
  if (!started) return;
  A.init();
  if (seq > 9.8) { $('#caption').classList.remove('show'); jumpTo(3.6); fx.sparkles(innerWidth / 2, innerHeight * .45, 6, 60); }
});
addEventListener('pointermove', e => { mouse = { x: e.clientX, y: e.clientY, t: T }; });
$('#btnSound').addEventListener('click', e => { e.stopPropagation(); A.init(); const on = A.toggle(); const b = e.currentTarget; b.querySelector('.w').style.display = on ? '' : 'none'; b.querySelector('.x').style.display = on ? 'none' : ''; });
$('#btnReplay').addEventListener('click', e => { e.stopPropagation(); A.init(); $('#caption').classList.remove('show'); jumpTo(0); });
document.addEventListener('visibilitychange', () => { if (!A.C) return; if (document.hidden) A.C.suspend(); else A.C.resume(); });
addEventListener('resize', layout);

layout();
// deep link for previews: #t=5.4 freezes the timeline at that moment (no audio)
const m = location.hash.match(/t=([\d.]+)/);
if (m) { started = true; $('#intro').classList.add('gone'); const t = parseFloat(m[1]); seq = t; playing = false; render(compute(), 0); runEvents(-1, t); if (t >= 9.6) { $('#caption').classList.add('show'); $('#hud').classList.add('show'); } }
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
